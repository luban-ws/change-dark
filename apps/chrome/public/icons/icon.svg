<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <!-- 深空：Solarized base03/深色 -->
    <linearGradient id="sky" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#002b36" />
      <stop offset="100%" stop-color="#073642" />
    </linearGradient>
    <!-- 月面：暗色模式隐喻，从暗部过渡到亮部 -->
    <linearGradient id="moon" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#586e75" />
      <stop offset="45%" stop-color="#93a1a1" />
      <stop offset="55%" stop-color="#eee8d5" />
      <stop offset="100%" stop-color="#fdf6e3" />
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fdf6e3" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#002b36" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="24" height="24" rx="5.5" fill="url(#sky)" />

  <!-- 月周光晕 -->
  <circle cx="12" cy="12" r="8.5" fill="url(#glow)" />

  <!-- 月亮主体 -->
  <circle cx="12" cy="12" r="7.8" fill="url(#moon)" />

  <!-- 嫦娥意象：飞天姿态 -->
  <!-- 使用流畅的曲线表现长袖和裙摆 -->
  <g fill="#268bd2">
    <!-- 头部和发髻 -->
    <circle cx="16" cy="8.2" r="1.1" />
    <path d="M 15.5,7.5 Q 16,5.5 16.5,7.5" />
    <!-- 身体/长裙 -->
    <path
      d="M 6,15.5 C 7.5,12 11,11 13,12 C 15,13 17,11 18,9.5 C 17.5,13.5 14,16 11,15 C 8,14 6.5,18 6,15.5 Z"
    />
  </g>

  <!-- 飘带 (披帛)：展现仙气 -->
  <path
    d="M 4,14 Q 9,8 14,10"
    fill="none"
    stroke="#2aa198"
    stroke-width="0.75"
    stroke-linecap="round"
    opacity="0.7"
  />
  <path
    d="M 8,17.5 Q 13,20.5 18,17"
    fill="none"
    stroke="#2aa198"
    stroke-width="0.55"
    stroke-linecap="round"
    opacity="0.5"
  />

  <!-- 远处星辰 -->
  <circle cx="4" cy="5" r="0.35" fill="#586e75" opacity="0.6" />
  <circle cx="20.5" cy="4.5" r="0.3" fill="#586e75" opacity="0.5" />
  <circle cx="20" cy="19.5" r="0.4" fill="#586e75" opacity="0.4" />

</svg>
