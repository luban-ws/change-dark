<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <!-- Neon Moon Gradient: Sky Blue -> Purple -> Emerald -->
    <linearGradient id="moonG" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="moonStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.7)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)" />
    </linearGradient>
  </defs>

  <!-- Glowing Crescent Moon filling the viewBox -->
  <path 
    d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" 
    fill="url(#moonG)" 
    stroke="url(#moonStroke)" 
    stroke-width="0.35"
    filter="url(#glow)"
  />
</svg>
