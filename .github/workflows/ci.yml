# 全 monorepo：build（含 WASM + 各 app）/ test / lint + Chrome Popup 性能与冒烟 E2E 门禁。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 版本由根目录 package.json 的 packageManager 字段唯一指定（避免与 action 的 version 冲突）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/dark-engine/target
            packages/dark-color-utils/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile

      - name: Build (Turbo)
        run: pnpm run build
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          CI: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_GITHUB_REPO: ${{ github.repository }}

      - run: pnpm run test
        env:
          TURBO_TELEMETRY_DISABLED: "1"

      - run: pnpm run lint
        env:
          TURBO_TELEMETRY_DISABLED: "1"

      - name: Upload built extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-dist
          path: |
            apps/chrome/dist
            packages/dark-engine/dist/index.mjs
          retention-days: 1

  e2e-perf:
    needs: build-test-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download built extension artifacts
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-dist
          path: .

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ubuntu24-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-ubuntu24-playwright-

      - name: Install Playwright Chromium
        run: pnpm --filter @change-dark/chrome exec playwright install --with-deps chromium

      - name: Run Popup Perf & Smoke E2E Gate
        run: pnpm --filter @change-dark/chrome run test:perf
        env:
          HEADLESS: "true"
          CI: "true"

      - name: Write Performance Summary
        if: always()
        run: pnpm --filter @change-dark/chrome run perf:summary

      - name: Upload Perf Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-popup-perf-report
          path: apps/chrome/test-results/perf-report.json
          if-no-files-found: ignore
          retention-days: 30
